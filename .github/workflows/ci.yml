# The workspace gate. Every job starts from `permissions: {}` and grants only what it needs.
#
#   lint         ruff check + ruff format --check, import-linter (the layers between packages),
#                actionlint + zizmor over the workflows
#   types        mypy --strict; pyright --verifytypes: every public name of every package typed
#   pytest       the locked suite on 3.12 / 3.13 / 3.14, with a coverage floor (raised only), the
#                SQL stores against a real Postgres service (a missing database FAILS, never skips)
#   test-lowest  each package at its declared dependency lower bounds (`--resolution lowest-direct`)
#   build        an sdist + wheel per package, `twine check --strict`
#   test         the one required check: green only when every job above is
#   gitleaks / dup-code / doc-refs   ci-kit's reusable workflows
#
# RUNNERS. Linux jobs run on the self-hosted pool when the repo variable CI_RUNNER is set (a JSON
# label list), else ubuntu-latest; unset is the kill switch. No job here holds a secret or a
# write token. release.yml calls this whole workflow before it builds anything to publish.
name: ci

on:
  push:
    branches: [base]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: &runner ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen --group lint
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .
      - name: ruff format
        run: uv run --no-sync ruff format --check .
      - name: import-linter
        run: uv run --no-sync lint-imports
      - name: actionlint
        run: uv run --no-sync actionlint
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }} # online audits (impostor commits, known-vulnerable actions)
        run: uv run --no-sync zizmor --format=github .

  types:
    name: types
    runs-on: *runner
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen --group types
      - name: mypy --strict
        run: uv run --no-sync mypy
      - name: pyright --verifytypes primitives_kit
        run: uv run --no-sync pyright --verifytypes primitives_kit --ignoreexternal
      - name: pyright --verifytypes platform_kit
        run: uv run --no-sync pyright --verifytypes platform_kit --ignoreexternal
      - name: pyright --verifytypes pack_contracts
        run: uv run --no-sync pyright --verifytypes pack_contracts --ignoreexternal

  pytest:
    name: pytest (${{ matrix.python }})
    runs-on: *runner
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    # platform-kit's SQL stores and its rate budget run against a REAL Postgres: a faked store proves
    # the caller, never the statement. REQUIRED=1 turns the local "no database -> skip" into a FAIL.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # Full history and tags: pack-contracts' ledger test compares the committed surface ledger with
      # the copy at every `pack-contracts-v*` tag and on `base` (append-only); REQUIRED=1 makes a
      # shallow clone FAIL that test instead of skipping it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - name: pytest
        env:
          PLATFORM_KIT_TEST_PG: postgresql://postgres:test@localhost:5432/postgres
          PLATFORM_KIT_TEST_PG_REQUIRED: "1"
          PACK_CONTRACTS_LEDGER_HISTORY_REQUIRED: "1"
        run: uv run --no-sync pytest -q --cov --cov-report=term

  # A plain (non-editable) install of each package at its lowest declared bounds, so the test
  # imports the built package, not the checkout, and a lower bound nobody ever ran is caught.
  test-lowest:
    name: test-lowest (${{ matrix.package }}, 3.12)
    runs-on: *runner
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: primitives-kit
          - package: pack-contracts
          # Every extra at its floor, with primitives-kit (its first-party dependency) at ITS floor.
          # The suite's test-only clients install AFTER, at normal resolution (a driver's oldest
          # release is not a bound this package declares). The Postgres tests skip in this leg (no
          # database): the locked pytest job runs them. The lowest starlette predates anyio's
          # BlockingPortal move, a deprecation in a TEST import (TestClient) this package never makes.
          - package: platform-kit
            extras: "[config,plugins,service,sql]"
            with: ./packages/primitives-kit
            test_deps: aiosqlite asyncpg httpx
            ignore_warning: "The anyio.abc.BlockingPortal alias is deprecated"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv venv
      - name: install at the lowest bounds
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}
          MATRIX_EXTRAS: ${{ matrix.extras }}
          MATRIX_WITH: ${{ matrix.with }}
        run: |
          reqs=("./packages/${MATRIX_PACKAGE}${MATRIX_EXTRAS}" "pytest>=9.2")
          if [ -n "${MATRIX_WITH}" ]; then reqs=("${MATRIX_WITH}" "${reqs[@]}"); fi
          uv pip install --resolution lowest-direct "${reqs[@]}"
      - name: install the test-only clients
        if: matrix.test_deps
        env:
          MATRIX_TEST_DEPS: ${{ matrix.test_deps }}
        run: |
          read -ra deps <<< "${MATRIX_TEST_DEPS}"
          uv pip install "${deps[@]}"
      - run: uv pip list
      - name: pytest
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}
          MATRIX_IGNORE_WARNING: ${{ matrix.ignore_warning }}
        run: |
          args=()
          if [ -n "${MATRIX_IGNORE_WARNING}" ]; then args=(-W "ignore:${MATRIX_IGNORE_WARNING}:DeprecationWarning"); fi
          .venv/bin/python -m pytest -q -p no:cacheprovider "${args[@]}" "packages/${MATRIX_PACKAGE}/tests"

  build:
    name: build
    runs-on: *runner
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv build --all-packages --no-sources
      - name: twine check
        run: uv run --frozen --only-group lint twine check --strict dist/*
      - name: each wheel resolves as published (its internal direct refs name tags that exist)
        # A wheel names another workspace package by a direct reference to that package's release
        # tag (tests/test_internal_deps.py holds the shape and the version bound). Every other leg
        # resolves the member on disk, so only this one reads the wheel's metadata alone, every
        # extra, the way a pip consumer does: a ref to a tag that is not pushed fails here.
        run: |
          uv venv -q "$RUNNER_TEMP/published"
          for whl in dist/*.whl; do
            extras=$(uv run --no-project python -c 'import sys, zipfile; z = zipfile.ZipFile(sys.argv[1]); m = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA")); print(",".join(l.split(": ", 1)[1] for l in z.read(m).decode().splitlines() if l.startswith("Provides-Extra: ")))' "$whl")
            VIRTUAL_ENV="$RUNNER_TEMP/published" uv pip install --dry-run "${whl}${extras:+[$extras]}"
          done

  # The required status check is named `test`; it aggregates every job above so a new leg is
  # covered without editing branch protection.
  test:
    name: test
    if: always()
    needs: [lint, types, pytest, test-lowest, build]
    runs-on: *runner
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  gitleaks:
    name: gitleaks (secret scan)
    permissions:
      contents: read
      pull-requests: read
    uses: mjdevaccount/ci-kit/.github/workflows/gitleaks.yml@v1
    with:
      mode: history

  # The same code written twice fails the PR (jscpd behind a shrink-only baseline).
  dup-code:
    permissions:
      contents: read
    uses: mjdevaccount/ci-kit/.github/workflows/dup-code.yml@v1

  # A doc reference is reported only when the path existed and is now gone (full history).
  doc-refs:
    permissions:
      contents: read
    uses: mjdevaccount/ci-kit/.github/workflows/doc-refs.yml@v1
