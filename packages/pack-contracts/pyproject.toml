[project]
name = "pack-contracts"
version = "0.1.0"
description = "The contracts a pack is written against: a pydantic pack manifest read without importing the pack, the pluggy hookspecs and markers, and a ledger that holds the versioning rule."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["plugins", "pluggy", "entry-points", "manifest", "contracts", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# The standard library, pydantic and pluggy, nothing else (tests/test_pack_purity.py reads the
# installed metadata and the modules a fresh interpreter loads). pluggy 1.7 is the first that fills
# hookspec defaults, which the versioning rule rests on. The lower bounds are the oldest the suite
# passes on (CI `lowest-direct`).
dependencies = ["pydantic>=2.9", "pluggy>=1.7"]

[project.urls]
Repository = "https://github.com/mjdevaccount/groundwork"
Changelog = "https://github.com/mjdevaccount/groundwork/blob/base/packages/pack-contracts/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pack_contracts"]
