[project]
name = "primitives-kit"
version = "0.1.0"
description = "Small shared contracts with no behaviour of their own: a rate-budget protocol, its error tree and the vendor quota reading."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["contracts", "protocol", "rate-limit", "budget", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# The standard library and pydantic, nothing else (tests/test_purity.py reads both the source and
# the installed metadata). The lower bound is the oldest pydantic the suite passes on (CI
# `lowest-direct`).
dependencies = ["pydantic>=2.9"]

[project.urls]
Repository = "https://github.com/mjdevaccount/groundwork"
Changelog = "https://github.com/mjdevaccount/groundwork/blob/base/packages/primitives-kit/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/primitives_kit"]
