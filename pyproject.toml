# The workspace root. It is not a package: each library is a member under packages/, with its own
# version, changelog and release tag (`<package>-vX.Y.Z`). One lockfile and one toolchain for all.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
primitives-kit = { workspace = true }
platform-kit = { workspace = true }
pack-contracts = { workspace = true }

[dependency-groups]
dev = [
    "primitives-kit",
    "platform-kit[config,packs,plugins,service,sql]",
    "pack-contracts",
    "aiosqlite>=0.21",
    "asyncpg>=0.30",
    "httpx2",
    "packaging>=24",
    "pytest>=9.2",
    "pytest-cov>=7.0",
    "testcontainers[postgres]>=4.10",
]
lint = [
    "ruff>=0.14",
    "import-linter>=2.5",
    "primitives-kit",
    "platform-kit[config,packs,plugins,service,sql]",
    "pack-contracts",
    "twine>=7.0",
    "actionlint-py==1.7.12.25",
    "zizmor==1.33.1",
]
types = [
    "primitives-kit",
    "platform-kit[config,packs,plugins,service,sql]",
    "pack-contracts",
    "aiosqlite>=0.21",
    "asyncpg>=0.30",
    "httpx2",
    "testcontainers[postgres]>=4.10",
    "mypy>=2.4",
    "packaging>=24",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2",
]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
testpaths = ["packages", "tests"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["primitives_kit", "platform_kit", "pack_contracts"]

[tool.coverage.report]
# Raised only, never lowered.
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["\\.\\.\\.$", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "DTZ", "PL", "C4", "PIE", "RET", "TC"]
ignore = ["PLR2004", "PT018"]

[tool.ruff.lint.per-file-ignores]
# platform-kit: public signatures whose keyword arguments are the API (argument count), and imports
# deferred on purpose so each extra stays optional (import-outside-top-level).
"packages/platform-kit/**" = ["PLR0913", "PLC0415"]
# FastAPI and pydantic read these annotations at runtime, so the imports cannot move under
# TYPE_CHECKING.
"packages/platform-kit/src/platform_kit/{config,service}/*" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["primitives_kit", "platform_kit", "pack_contracts"]

[tool.mypy]
strict = true
python_version = "3.12"
files = [
    "packages/primitives-kit/src",
    "packages/primitives-kit/tests",
    "packages/platform-kit/src",
    "packages/platform-kit/tests",
    "packages/pack-contracts/src",
    "packages/pack-contracts/tests",
    "tests",
]
plugins = ["pydantic.mypy"]

# platform-kit's suite came over from its first home with untyped test signatures. The bodies are
# still checked (`check_untyped_defs`); only the signature rules are off, for that suite alone.
# Ratchet: annotate a test file and it is strict again; this override shrinks, never grows. It
# matches by MODULE name: only platform-kit's suite is a `tests` package (primitives-kit's has no
# `__init__.py`), so a package that adds `tests/__init__.py` must not reuse that name.
[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

# The layers between the workspace packages (bottom-up). primitives-kit is the floor: it imports no
# other first-party package, so any library can depend on it without a cycle. A package added
# here joins the contract in the same change that adds it.
[tool.importlinter]
root_packages = ["primitives_kit", "platform_kit", "pack_contracts"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "floor"
name = "primitives_kit imports no other first-party library"
type = "forbidden"
source_modules = ["primitives_kit"]
forbidden_modules = ["platform_kit", "pack_contracts", "llm_ports", "content_data", "market_ports"]

# platform_kit sits on the floor and on pack_contracts (its `packs` loader is the host side of the
# contracts a pack is written against; the reverse is the "pack-contracts" contract below).
[[tool.importlinter.contracts]]
id = "platform"
name = "platform_kit imports no first-party library but the floor and the pack contracts"
type = "forbidden"
source_modules = ["platform_kit"]
forbidden_modules = ["llm_ports", "content_data", "market_ports"]

# What a pack depends on: it sits on the floor and imports nothing that RUNS a pack (platform-kit's
# loader plugs it in, C2). A pack importing platform_kit would make the implementation a contract.
[[tool.importlinter.contracts]]
id = "pack-contracts"
name = "pack_contracts imports no first-party library but the floor"
type = "forbidden"
source_modules = ["pack_contracts"]
forbidden_modules = ["platform_kit", "llm_ports", "content_data", "market_ports"]
